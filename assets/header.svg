<svg width="100%" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sitharaj — Senior Mobile and Web Engineer, Gen AI Engineer">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#22d3ee;#818cf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#22d3ee;#818cf8;#c084fc" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#818cf8;#c084fc;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8b9bb4" stroke-width="1"/>
    </pattern>
    <clipPath id="card">
      <rect x="1" y="1" width="1198" height="418" rx="24"/>
    </clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .phrase { opacity: 0; animation: cycle 12s infinite; }
      .p2 { animation-delay: 4s; }
      .p3 { animation-delay: 8s; }
      @keyframes cycle {
        0% { opacity: 0; }
        4% { opacity: 1; }
        29% { opacity: 1; }
        33% { opacity: 0; }
        100% { opacity: 0; }
      }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .blobA { animation: driftA 14s ease-in-out infinite alternate; }
      .blobB { animation: driftB 18s ease-in-out infinite alternate; }
      .blobC { animation: driftC 16s ease-in-out infinite alternate; }
      @keyframes driftA { from { transform: translate(0, 0); } to { transform: translate(90px, 40px); } }
      @keyframes driftB { from { transform: translate(0, 0); } to { transform: translate(-110px, -30px); } }
      @keyframes driftC { from { transform: translate(0, 0); } to { transform: translate(60px, -50px); } }
    </style>
  </defs>

  <!-- Card background -->
  <rect x="1" y="1" width="1198" height="418" rx="24" fill="#0b0f19" stroke="#232b40" stroke-width="2"/>

  <g clip-path="url(#card)">
    <!-- Ambient light blobs -->
    <g class="blobA"><circle cx="220" cy="90" r="260" fill="url(#blobA)"/></g>
    <g class="blobB"><circle cx="1020" cy="330" r="300" fill="url(#blobB)"/></g>
    <g class="blobC"><circle cx="780" cy="40" r="220" fill="url(#blobC)"/></g>
    <!-- Grid overlay -->
    <rect x="1" y="1" width="1198" height="418" fill="url(#grid)" opacity="0.07"/>
  </g>

  <!-- Corner details -->
  <text x="44" y="56" class="mono" font-size="15" fill="#54627e">~/sitharaj88</text>
  <text x="1156" y="56" class="mono" font-size="15" fill="#54627e" text-anchor="end">13+ yrs · est. 2011</text>

  <!-- Name -->
  <text x="600" y="196" class="sans" font-size="86" font-weight="800" letter-spacing="8" text-anchor="middle" fill="url(#nameGrad)">SITHARAJ</text>

  <!-- Role -->
  <text x="600" y="244" class="sans" font-size="19" font-weight="600" letter-spacing="5" text-anchor="middle" fill="#94a3b8">SENIOR MOBILE &amp; WEB ENGINEER &#183; GEN AI ENGINEER</text>

  <!-- Rotating taglines -->
  <g class="mono" font-size="17" text-anchor="middle">
    <text x="600" y="302" fill="#67e8f9" class="phrase">&#9656; building AI-native products with LLM agents &amp; RAG</text>
    <text x="600" y="302" fill="#c4b5fd" class="phrase p2">&#9656; 13+ years shipping mobile &amp; web at scale</text>
    <text x="600" y="302" fill="#86efac" class="phrase p3">&#9656; open source on npm &amp; Maven Central</text>
  </g>

  <!-- Status chip -->
  <g>
    <rect x="480" y="336" width="240" height="38" rx="19" fill="#111827" stroke="#232b40" stroke-width="1.5"/>
    <circle cx="504" cy="355" r="5" fill="#34d399" class="dot"/>
    <text x="612" y="361" class="sans" font-size="15" font-weight="600" text-anchor="middle" fill="#94a3b8">open to collaborations</text>
  </g>
</svg>
